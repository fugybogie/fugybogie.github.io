<style id="animation-grid">
/* Animation page: videos wrap into rows of 4 instead of a sideways-scrolling strip */
.animation-grid-page .video-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 20px;
  padding: 0 20px 40px;
  box-sizing: border-box;
}
.animation-grid-page .video-grid .video-card { flex: none; width: auto; min-width: 0; }
@media (max-width: 1200px) { .animation-grid-page .video-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 600px)  { .animation-grid-page .video-grid { grid-template-columns: 1fr; gap: 12px; padding: 0 12px 32px; } }
.animation-grid-page .video-section { margin-top: 56px; }
.animation-grid-page .section-title {
  margin: 0 20px 22px;
  color: #ffffff;
  font-family: "Space Grotesk", Arial, sans-serif;
  font-size: 38px;
  font-weight: 600;
  letter-spacing: 0.02em;
  line-height: 1;
  display: flex;
  align-items: center;
  gap: 18px;
}
.animation-grid-page .section-title::after {
  content: "";
  flex: 1;
  height: 1px;
  background: rgba(255,255,255,0.18);
}
@media (max-width: 600px) {
  .animation-grid-page .video-section { margin-top: 40px; }
  .animation-grid-page .section-title { margin: 0 12px 16px; font-size: 30px; }
}
.animation-grid-page .yt-player iframe {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  border: 0; display: block;
}
.animation-grid-page .yt-facade {
  position: absolute; inset: 0; width: 100%; height: 100%;
  padding: 0; border: 0; background: #000; cursor: pointer;
}
.animation-grid-page .yt-facade img { width: 100%; height: 100%; object-fit: cover; display: block; }
.animation-grid-page .yt-play {
  position: absolute; left: 50%; top: 50%; width: 68px; height: 48px; transform: translate(-50%,-50%);
  background: rgba(20,20,20,.8); border-radius: 12px; transition: background .15s;
}
.animation-grid-page .yt-play::after {
  content: ""; position: absolute; left: 27px; top: 14px;
  border-style: solid; border-width: 10px 0 10px 17px; border-color: transparent transparent transparent #fff;
}
.animation-grid-page .yt-facade:hover .yt-play,
.animation-grid-page .yt-facade:focus-visible .yt-play { background: #ff0000; }
/* Rig section: everything blurred except a soft clear spot that moves from video to video */
@property --fx { syntax: "<length>"; inherits: false; initial-value: 0px; }
@property --fy { syntax: "<length>"; inherits: false; initial-value: 0px; }
@property --rw { syntax: "<length>"; inherits: false; initial-value: 300px; }
@property --rh { syntax: "<length>"; inherits: false; initial-value: 200px; }
.animation-grid-page #rig-grid { position: relative; }
.animation-grid-page .focus-blur {
  position: absolute; inset: 0; z-index: 20; pointer-events: none;
  -webkit-backdrop-filter: blur(7px); backdrop-filter: blur(7px);
  transition: --fx 1.2s ease-in-out, --fy 1.2s ease-in-out, --rw 1.2s ease-in-out, --rh 1.2s ease-in-out;
  -webkit-mask-image: radial-gradient(var(--rw) var(--rh) at var(--fx) var(--fy), transparent 0%, transparent 58%, #000 100%);
          mask-image: radial-gradient(var(--rw) var(--rh) at var(--fx) var(--fy), transparent 0%, transparent 58%, #000 100%);
}
/* "Uncover" cue over the blurred Rig videos: same bounce + pulse as the scroll arrow on Home */
.animation-grid-page .uncover-cue {
  position: absolute; left: 50%; top: 0; z-index: 30;
  transform: translate(-50%, -50%);
  padding: 6px 14px; border: 0; background: transparent; cursor: pointer;
  font-family: "Space Grotesk", Arial, sans-serif; font-weight: 700; font-size: 64px;
  letter-spacing: 0.04em; line-height: 1; color: #fff;
  filter: drop-shadow(0 2px 6px rgba(0,0,0,.75));
  transition: top .35s ease-out;
}
.animation-grid-page .uncover-cue > span {
  display: inline-block;
  animation: more-videos-bounce 1.4s ease-in-out infinite, more-videos-pulse 1.4s ease-in-out infinite;
}
.animation-grid-page .uncover-cue:focus-visible { outline: 2px solid #fff; border-radius: 12px; }
.animation-grid-page .uncover-cue[hidden] { display: none; }
.animation-grid-page .focus-blur { opacity: 1; }
.animation-grid-page .focus-blur.is-off { opacity: 0; }
@keyframes rig-line-pulse { 0%,100% { background: rgba(255,255,255,.18); } 50% { background: rgba(255,255,255,.95); box-shadow: 0 0 8px rgba(255,255,255,.55); } }
.animation-grid-page #rig.uncovered .section-title::after { animation: rig-line-pulse 1.4s ease-in-out infinite; height: 2px; }
@media (prefers-reduced-motion: reduce) { .animation-grid-page #rig.uncovered .section-title::after { animation: none; background: rgba(255,255,255,.6); } }
@media (max-width: 600px) { .animation-grid-page .uncover-cue { font-size: 42px; } }
@media (prefers-reduced-motion: reduce) { .animation-grid-page .uncover-cue > span { animation: none; } }
/* Section titles: the section you are looking at gets its title glided to the centre,
   with lines on both sides and a magic glowing pulse; the others sit on the left, calm. */
.animation-grid-page .section-title--first { margin: 10px 20px 16px; }
/* First row of Animation videos sits exactly midway between the "Animation" and "Rig" titles */
.feature-stage { padding-bottom: 0; }
.animation-grid-page #rig { margin-top: 16px; }
.animation-grid-page .section-title::before {
  content: ""; height: 1px; flex: 0 1 0px; min-width: 0;
  background: linear-gradient(to left, rgba(255,255,255,.55), rgba(255,255,255,0));
  transition: flex-grow .9s cubic-bezier(.65,0,.35,1), opacity .6s ease;
  opacity: 0;
}
.animation-grid-page .section-title::after { transition: background .6s ease; }
.animation-grid-page .section-title > span { padding: 0 6px; white-space: nowrap; }
.animation-grid-page .section-title.is-active::before { flex-grow: 1; opacity: 1; }
.animation-grid-page .section-title.is-active::after {
  background: linear-gradient(to right, rgba(255,255,255,.55), rgba(255,255,255,0));
}
.animation-grid-page .section-title.is-active::before,
.animation-grid-page .section-title.is-active::after { animation: title-line-glow 2.4s ease-in-out infinite; }
.animation-grid-page .section-title.is-active > span {
  background: linear-gradient(100deg, #ffffff 0%, #ffffff 38%, #e9ffb0 47%, #d1fe17 50%, #e9ffb0 53%, #ffffff 62%, #ffffff 100%);
  background-size: 250% 100%;
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
  animation: title-shimmer 3.2s linear infinite, title-glow 2.4s ease-in-out infinite;
}
@keyframes title-shimmer { 0% { background-position: 125% 0; } 100% { background-position: -125% 0; } }
@keyframes title-glow {
  0%, 100% { filter: drop-shadow(0 0 0 rgba(209,254,23,0)); }
  50% { filter: drop-shadow(0 0 10px rgba(209,254,23,.55)) drop-shadow(0 0 22px rgba(255,255,255,.25)); }
}
@keyframes title-line-glow { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
@media (max-width: 600px) { .animation-grid-page .section-title > span { white-space: normal; } }
@media (prefers-reduced-motion: reduce) {
  .animation-grid-page .section-title::before { transition: none; }
  .animation-grid-page .section-title.is-active > span,
  .animation-grid-page .section-title.is-active::before,
  .animation-grid-page .section-title.is-active::after { animation: none; }
}
</style>

<style id="anim-refine">
/* Animation page design pass: same canvas as Home/Contacts, sections as rounded panels,
   cards with hairline borders and a lime hover ring, a proper "coming soon" placeholder. */

body > #container { background: rgba(10,10,11,.82) !important; }

.animation-grid-page { padding-bottom: 40px; }
.animation-grid-page .section-title--first { margin: 18px 20px 20px !important; }
.feature-stage { padding: 0 20px !important; }

/* Rig and Unreal sections become rounded panels */
.animation-grid-page .video-section {
  margin: 28px 16px 0 !important; padding: 26px 0 26px; border-radius: 22px;
  background: var(--ap-panel); border: 1px solid var(--ap-line);
}
.animation-grid-page .video-section .section-title { margin: 0 24px 22px !important; }
.animation-grid-page .video-section .video-grid { padding: 0 24px !important; }

/* cards */
.animation-grid-page .video-card-player {
  border-radius: 14px !important; overflow: hidden; border: 1px solid var(--ap-line); background: #000;
  transition: transform .25s ease, box-shadow .25s ease;
}
.animation-grid-page .video-card:hover .video-card-player {
  transform: translateY(-3px); box-shadow: 0 18px 40px rgba(0,0,0,.55), 0 0 0 1px rgba(209,254,23,.35);
}
.animation-grid-page .empty-video-slot {
  background: repeating-linear-gradient(135deg, #131417 0 12px, #16171a 12px 24px) !important;

  <script>
    document.querySelectorAll('.video-carousel-shell').forEach((shell) => {
      const carousel = shell.querySelector('.video-carousel');
      const left = shell.querySelector('.carousel-arrow-left');
      const right = shell.querySelector('.carousel-arrow-right');
      const scrollAmount = () => {
        const card = carousel.querySelector('.video-card');
        const gap = parseFloat(getComputedStyle(carousel).columnGap) || 0;
        return card ? card.getBoundingClientRect().width + gap : carousel.clientWidth;
      };
      left.addEventListener('click', () => carousel.scrollBy({ left: -scrollAmount(), behavior: 'smooth' }));
      right.addEventListener('click', () => carousel.scrollBy({ left: scrollAmount(), behavior: 'smooth' }));
      const positionArrows = () => {
        const player = carousel.querySelector('.video-card-player');
        if (!player) return;
        const top = player.getBoundingClientRect().height / 2 - left.offsetHeight / 2;
        left.style.top = right.style.top = top + 'px';
      };
      new ResizeObserver(positionArrows).observe(carousel);
      positionArrows();
    });
  </script>

  <script>
    const videoStates = new Map();
    function startVisibleVideo(element) {
      let state = videoStates.get(element);
      if (!state) {
        const source = element.querySelector('source[data-src]');
        if (!source) return;
        const url = source.dataset.src;
        source.remove();
        const player = videojs(element, {
          autoplay: false, muted: true, preload: 'none',
          bigPlayButton: false,
          controlBar: { children: ['progressControl'] }
        });
        state = { player, visible: true };
        videoStates.set(element, state);
        const wrapper = player.el();
        wrapper.addEventListener('pointermove', (event) => {
          if (event.pointerType !== 'mouse') return;
          wrapper.classList.add('timeline-hover');
          if (!player.paused()) player.muted(false);
        });
        wrapper.addEventListener('pointerleave', (event) => {
          if (event.pointerType !== 'mouse') return;
          wrapper.classList.remove('timeline-hover');
          player.muted(true);
        });
        player.on('play', () => {
          if (!state.visible || document.hidden) player.pause();
        });
        player.src({ src: url, type: 'application/x-mpegURL' });
      }
      state.visible = true;
      if (!document.hidden) state.player.play().catch(() => {});
    }
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(({ target, isIntersecting }) => {
        if (isIntersecting) startVisibleVideo(target._video);
        else {
          const state = videoStates.get(target._video);
          if (state) { state.visible = false; state.player.pause(); state.player.muted(true); }
        }
      });
    }, { rootMargin: '0px', threshold: 0 });
    document.querySelectorAll('.video-card-player').forEach((container) => {
      const video = container.querySelector('video');
      // Observe the stable container because Video.js moves the original video element.
      if (video) {
        container._video = video;
        observer.observe(container);
      }
    });
    document.addEventListener('visibilitychange', () => {
      videoStates.forEach(({ player, visible }) => {
        if (document.hidden) { player.pause(); player.muted(true); }
        else if (visible) player.play().catch(() => {});
      });
    });
  </script>

  <script>
    (() => {
      const down = document.getElementById('more-videos-arrow');
      const up = document.getElementById('previous-videos-arrow');
      const rows = [...document.querySelectorAll('.video-showcase .video-carousel-shell')];
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const bounds = row => {
        const players = [...row.querySelectorAll('.video-card-player')];
        return { top: Math.min(...players.map(p => p.getBoundingClientRect().top)),
                 bottom: Math.max(...players.map(p => p.getBoundingClientRect().bottom)) };
      };
      const nextRow = () => rows.find(row => bounds(row).bottom > window.innerHeight + 12);
      const previousRow = () => [...rows].reverse().find(row => bounds(row).top < -12);
      const updateCue = () => {
        down.hidden = !nextRow();
        up.hidden = !previousRow();
      };
      const scrollToRow = (row, direction) => {
        if (!row) return;
        const rect = bounds(row);
        const top = window.scrollY + (direction === 'down' ? rect.bottom - window.innerHeight : rect.top);
        window.scrollTo({ top: Math.max(0, top), behavior: reducedMotion.matches ? 'auto' : 'smooth' });
      };
      down.addEventListener('click', () => scrollToRow(nextRow(), 'down'));
      up.addEventListener('click', () => scrollToRow(previousRow(), 'up'));
      window.addEventListener('scroll', updateCue, { passive: true });
      window.addEventListener('resize', updateCue);
      window.addEventListener('load', updateCue);
      new ResizeObserver(updateCue).observe(document.body);
      updateCue();
    })();
  </script>
  <script>
    // YouTube players: show the thumbnail first, load the real player on click.
    // When the page is opened straight from a folder (file://), YouTube refuses to embed (error 153),
    // so in that case the video opens on YouTube in a new tab instead.
    document.querySelectorAll('.yt-player[data-yt]').forEach((box) => {
      const id = box.dataset.yt;
      box.querySelector('.yt-facade').addEventListener('click', () => {
        if (location.protocol === 'file:') {
          window.open('https://www.youtube.com/watch?v=' + id, '_blank', 'noopener');
          return;
        }
        const f = document.createElement('iframe');
        f.src = 'https://www.youtube-nocookie.com/embed/' + id + '?rel=0&autoplay=1';
        f.title = 'YouTube video';
        f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
        f.referrerPolicy = 'strict-origin-when-cross-origin';
        f.allowFullscreen = true;
        box.innerHTML = '';
        box.appendChild(f);
      });
    });
  </script>
  <script>
    // Rig "searching gaze" blur + "Uncover" cue.
    // - Covered state: Rig videos blurred, a clear spot starts on the snowman and darts between
    //   visible videos; "Uncover" pulses in the middle of the visible part of the grid.
    // - Uncovered (click "Uncover", or scroll below the 2nd Rig row): blur and text fade away,
    //   only the pulsing line next to the "Rig" title remains.
    // - Scrolling back up until the top Animation videos are in view resets the covered state,
    //   starting again on the snowman.
    (() => {
      const blur = document.querySelector('.focus-blur[data-focus]');
      const cue = document.querySelector('.uncover-cue');
      const section = document.getElementById('rig');
      const topGrid = document.querySelector('.animation-grid-page .video-grid');
      if (!blur || !cue || !section) return;
      const grid = blur.parentElement;
      const cards = [...grid.querySelectorAll('.yt-player[data-yt]')];
      const home = Math.max(0, cards.findIndex(c => c.dataset.yt === blur.dataset.focus));
      cue.innerHTML = '<span>' + cue.textContent + '</span>';
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const rand = (a, b) => a + Math.random() * (b - a);

      let i = home, covered = true, locked = false, timers = [];
      const later = (fn, ms) => timers.push(setTimeout(fn, ms));
      const clearAll = () => { timers.forEach(clearTimeout); timers = []; };
      const cols = () => Math.max(1, Math.round(grid.clientWidth / cards[0].getBoundingClientRect().width));

      const aim = (k, dx = 0, dy = 0, ms = 0, ease = 'cubic-bezier(.34,1.56,.64,1)') => {
        const t = cards[k].getBoundingClientRect(), g = grid.getBoundingClientRect();
        blur.style.transition = (ms ? ['--fx','--fy','--rw','--rh'].map(p => `${p} ${ms}ms ${ease}`).join(',') + ',' : '') + 'opacity .6s ease';
        blur.style.setProperty('--fx', (t.left - g.left + t.width / 2 + dx * t.width) + 'px');
        blur.style.setProperty('--fy', (t.top - g.top + t.height / 2 + dy * t.height) + 'px');
        blur.style.setProperty('--rw', (t.width * 0.92) + 'px');
        blur.style.setProperty('--rh', (t.height * 0.95) + 'px');
      };
      const visible = (j) => {
        const r = cards[j].getBoundingClientRect(), vh = window.innerHeight, vw = window.innerWidth;
        return Math.min(r.bottom, vh) - Math.max(r.top, 0) > r.height * 0.6 &&
               Math.min(r.right, vw) - Math.max(r.left, 0) > r.width * 0.6;
      };
      const nextIndex = () => {
        const c = cols(), n = cards.length;
        const inView = cards.map((_, j) => j).filter(j => j !== i && visible(j));
        if (!inView.length) return -1;
        const near = [-1, 1, -c, c, -c - 1, -c + 1, c - 1, c + 1].map(d => i + d)
          .filter(j => j >= 0 && j < n && j !== i && Math.abs((j % c) - (i % c)) <= 1 && visible(j));
        const pool = (near.length && Math.random() >= 0.25) ? near : inView;
        return pool[Math.floor(Math.random() * pool.length)];
      };
      const drift = (until) => {
        if (!covered || locked || performance.now() > until) return;
        aim(i, rand(-0.07, 0.07), rand(-0.07, 0.07), rand(220, 380), 'ease-in-out');
        later(() => drift(until), rand(260, 420));
      };
      const look = () => {
        if (!covered || locked) return;
        const j = nextIndex();
        if (j < 0) { later(look, 400); return; }
        i = j;
        const dart = rand(260, 420);
        aim(i, 0, 0, dart);
        const dwell = Math.random() < 0.2 ? rand(1600, 2400) : rand(550, 1100);
        later(() => drift(performance.now() + dwell - 150), dart);
        later(look, dart + dwell);
      };
      const startGaze = () => {
        clearAll(); i = home; aim(i, 0, 0, 0);
        if (reduced || document.hidden) return;
        later(() => drift(performance.now() + 1500), 50);
        later(look, 1700);
      };

      const placeCue = () => {
        const g = grid.getBoundingClientRect();
        const top = Math.max(g.top, 0), bottom = Math.min(g.bottom, window.innerHeight);
        cue.style.visibility = (bottom - top < 120) ? 'hidden' : '';
        cue.style.top = ((top + bottom) / 2 - g.top) + 'px';
      };

      const uncover = () => {
        if (!covered) return;
        covered = false; clearAll();
        blur.classList.add('is-off');
        cue.hidden = true;
        section.classList.add('uncovered');
      };
      const cover = () => {
        if (covered) return;
        covered = true; locked = false;
        blur.classList.remove('is-off');
        cue.hidden = false;
        section.classList.remove('uncovered');
        placeCue();
        startGaze();
      };

      cue.addEventListener('click', uncover);
      // Moving the mouse over the blurred Rig videos uncovers them too (until the top row is shown again).
      grid.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') uncover(); });
      cards.forEach((c, k) => c.addEventListener('click', () => {
        if (!covered) return;
        locked = true; clearAll(); i = k; aim(i, 0, 0, 450);
      }, true));

      // Visitor went below the 2nd Rig row = the 3rd row has come into view (after scrolling).
      const pastSecondRow = () => {
        const c = cols(), third = cards[2 * c];
        if (!third || window.scrollY <= 0) return false;
        return third.getBoundingClientRect().top < window.innerHeight - 40;
      };
      // The first row of videos (top Animation videos, above Rig) is mostly on screen.
      const topRowVisible = () => {
        if (!topGrid) return false;
        const t = topGrid.getBoundingClientRect();
        return Math.min(t.bottom, window.innerHeight) - Math.max(t.top, 0) >= t.height * 0.6;
      };
      const onScroll = () => {
        if (covered) {
          placeCue();
          if (pastSecondRow()) uncover();
        } else if (topRowVisible()) {
          cover();
        }
      };
      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', () => { placeCue(); aim(i, 0, 0, 0); });
      new ResizeObserver(() => { placeCue(); aim(i, 0, 0, 0); }).observe(grid);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) clearAll(); else if (covered && !locked) { later(look, 600); }
      });

      placeCue();
      startGaze();
      onScroll();
    })();
  </script>
  <script>
    // YouTube thumbnails: always show the video's current thumbnail (also custom ones uploaded later),
    // sharpest version first with fallbacks; refreshed at least once an hour.
    // Black bars baked into a thumbnail (left/right or top/bottom) are detected and zoomed away.
    (() => {
      const stamp = Math.floor(Date.now() / 3600000);
      const sizes = ['maxresdefault', 'sddefault', 'hqdefault'];

      const trimBars = (img) => {
        try {
          const W = 160, H = 90, c = document.createElement('canvas');
          c.width = W; c.height = H;
          const x = c.getContext('2d', { willReadFrequently: true });
          x.drawImage(img, 0, 0, W, H);
          const d = x.getImageData(0, 0, W, H).data;
          const lum = (px, py) => { const i = (py * W + px) * 4; return (d[i] + d[i + 1] + d[i + 2]) / 3; };
          const colDark = (px) => { let m = 0; for (let y = 0; y < H; y++) m = Math.max(m, lum(px, y)); return m < 22; };
          const rowDark = (py) => { let m = 0; for (let k = 0; k < W; k++) m = Math.max(m, lum(k, py)); return m < 22; };
          let l = 0, r = 0, t = 0, b = 0;
          while (l < W * 0.3 && colDark(l)) l++;
          while (r < W * 0.3 && colDark(W - 1 - r)) r++;
          while (t < H * 0.3 && rowDark(t)) t++;
          while (b < H * 0.3 && rowDark(H - 1 - b)) b++;
          if (l + r + t + b < 3) { img.style.transform = ''; return; }
          const s = Math.max(W / (W - l - r), H / (H - t - b));
          const cx = (l + (W - r)) / 2 / W - 0.5, cy = (t + (H - b)) / 2 / H - 0.5;
          img.style.transformOrigin = '50% 50%';
          img.style.transform = `translate(${(-cx * s * 100).toFixed(2)}%, ${(-cy * s * 100).toFixed(2)}%) scale(${s.toFixed(4)})`;
        } catch (e) { /* image not readable: leave it as is */ }
      };

      document.querySelectorAll('.yt-player[data-yt] .yt-facade img').forEach((img) => {
        const id = img.closest('.yt-player').dataset.yt;
        let k = 0, cors = true;
        const load = () => {
          if (k >= sizes.length) return;
          if (cors) img.crossOrigin = 'anonymous'; else img.removeAttribute('crossorigin');
          img.src = `https://i.ytimg.com/vi/${id}/${sizes[k]}.jpg?t=${stamp}`;
        };
        img.addEventListener('load', () => {
          if (img.naturalWidth <= 120) { k++; load(); return; }   // 120px = "no such image"
          if (cors) trimBars(img);
        });
        img.addEventListener('error', () => {
          if (cors) { cors = false; load(); } else { k++; cors = true; load(); }
        });
        load();
      });
    })();
  </script>
  <script>
    // The title of the section whose videos cross the middle of the screen glides to the centre and glows.
    (() => {
      const two = () => false;
      const pairs = [
        [document.getElementById('animation-title'), document.querySelector('.feature-stage')],
        [document.getElementById('rig-title'), document.getElementById('rig-grid')],
        [document.getElementById('unreal-title'), document.getElementById('unreal-grid')],
      ].filter(([t, g]) => t && g);
      let raf = 0;
      const pick = (list) => {
        const mid = window.innerHeight / 2;
        let best = null, bestDist = Infinity;
        for (const [t, g] of list) {
          const r = g.getBoundingClientRect();
          const d = (mid >= r.top && mid <= r.bottom) ? 0 : Math.min(Math.abs(r.top - mid), Math.abs(r.bottom - mid));
          if (d < bestDist) { bestDist = d; best = t; }
        }
        return best;
      };
      const update = () => {
        raf = 0;
        let active;
        if (two()) {
          // side by side: the Animation title stays lit; Rig or Unreal lights up in the right column
          active = [pairs[0][0], pick(pairs.slice(1))];
        } else {
          active = [pick(pairs)];
        }
        pairs.forEach(([t]) => t.classList.toggle('is-active', active.includes(t)));
      };
      const queue = () => { if (!raf) raf = requestAnimationFrame(update); };
      window.addEventListener('scroll', queue, { passive: true });
      window.addEventListener('resize', queue);
      update();
    })();
  </script>
  <script>
    // Every 10 seconds one of the small Animation videos glides into the big spot and the big one
    // shrinks and glides into its place in the Animation column (FLIP animation).
    (() => {
      const stage = document.querySelector('.feature-stage');
      const col = document.querySelector('#anim-col .stage-scroll');
      if (!stage || !col || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const INTERVAL = 10000, DURATION = 900;
      let slot = 0, visible = true, busy = false;
      const isEmpty = (c) => !!c.querySelector('.empty-video-slot');
      const swap = () => {
        if (busy || !visible || document.hidden || !window.matchMedia('(min-width: 1101px)').matches) return;
        const smalls = [...col.children].filter(c => c.classList.contains('video-card'));
        const pool = smalls.filter(c => !isEmpty(c));
        if (!pool.length) return;
        const small = pool[slot % pool.length]; slot++;
        const big = stage.querySelector(':scope > .video-card');
        busy = true;
        const before = new Map([big, small].map(el => [el, el.getBoundingClientRect()]));
        const marker = document.createComment('');
        col.replaceChild(marker, small);
        stage.replaceChild(small, big);
        col.replaceChild(big, marker);
        [big, small].forEach(el => {
          const a = before.get(el), b = el.getBoundingClientRect();
          el.style.transformOrigin = '0 0'; el.style.zIndex = el === small ? '3' : '2'; el.style.position = 'relative';
          el.animate([
            { transform: `translate(${a.left - b.left}px, ${a.top - b.top}px) scale(${a.width / b.width}, ${a.height / b.height})` },
            { transform: 'none' }
          ], { duration: DURATION, easing: 'cubic-bezier(.65,0,.35,1)' }).finished.then(() => {
            el.style.zIndex = ''; el.style.transformOrigin = ''; el.style.position = ''; busy = false;
          });
        });
      };
      new IntersectionObserver(([e]) => { visible = e.isIntersecting; }).observe(stage);
      setInterval(swap, INTERVAL);
    })();
  </script>

      up.addEventListener('click', () => sc.scrollBy({ top: -step(), behavior: 'smooth' }));

        shakeTimer = setTimeout(() => {

  <script>
    // Gallery: shows every image / video in images/for_animation_page automatically.
    // The file list comes from GitHub (the site's repo), so anything pushed to that folder appears by itself.
    // FALLBACK is only used when GitHub can't be reached (e.g. offline).
    (() => {
      const grid = document.getElementById('gallery-grid');
      if (!grid) return;
      const DIR = 'images/for_animation_page/';
      const API = 'https://api.github.com/repos/fugybogie/fugybogie.github.io/contents/images/for_animation_page';
      const FALLBACK = ["a1.mp4", "a4.gif", "aiko.gif", "baby.gif", "brown.mp4", "c2.mp4", "cera.gif", "eferg.gif", "go19.mp4", "iiii.mp4", "iiiii-ezgif.com-resize_2.gif", "iliii.mp4", "p3-ezgif.com-resize.gif", "pipo-ezgif.com-resize.gif", "pipo.gif", "rgeeeeee.mp4", "rgergre.mp4", "rgrth.gif", "rgrthjtyj.gif", "rgth.gif", "rthyj.gif", "sloth.mp4", "tgy14.gif", "tgy4.gif", "trhrth.gif", "uiluluili.mp4", "yjy.gif"];
      const IMG = /\.(gif|png|jpe?g|webp|avif)$/i, VID = /\.(mp4|webm|mov)$/i;
      const rnd = (a, b) => a + Math.random() * (b - a);
      const seen = new Set();
      // new random order on every page load
      const shuffle = (a) => { a = [...new Set(a)]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
      const hover = window.matchMedia('(hover: hover)').matches;
      let layer = null, owner = null;
      const close = () => { if (layer) layer.remove(); if (owner) owner.classList.remove('is-zoomed'); layer = owner = null; };
      const open = (p) => {
        close();
        const m = p.querySelector('img, video');
        if (!m) return;
        const nw = m.naturalWidth || m.videoWidth || 4, nh = m.naturalHeight || m.videoHeight || 3;
        const r = p.getBoundingClientRect();
        const vw = innerWidth, vh = innerHeight, pad = 12;
        let w = r.width * 1.9, h = w * nh / nw;
        const maxH = vh - 2 * pad - 60, maxW = vw - 2 * pad;
        if (h > maxH) { h = maxH; w = h * nw / nh; }
        if (w > maxW) { w = maxW; h = w * nh / nw; }
        let x = r.left + r.width / 2 - w / 2, y = r.top + r.height / 2 - h / 2;
        x = Math.max(pad, Math.min(x, vw - pad - w));
        y = Math.max(pad + 50, Math.min(y, vh - pad - h));
        layer = document.createElement('div');
        layer.className = 'pin-zoom';
        Object.assign(layer.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
        layer.style.setProperty('--tx', (r.left + r.width / 2 - x) + 'px');
        layer.style.setProperty('--ty', (r.top + r.height / 2 - y) + 'px');
        const c = m.cloneNode(true);
        c.removeAttribute('style');
        if (c.tagName === 'VIDEO') { c.muted = true; c.loop = true; c.playsInline = true; c.currentTime = m.currentTime || 0; c.play().catch(() => {}); }
        layer.appendChild(c);
        document.body.appendChild(layer);
        // an ancestor transform can turn position:fixed into page-relative; correct the offset
        layer.style.animation = 'none';
        const got = layer.getBoundingClientRect();
        if (Math.abs(got.top - y) > 1 || Math.abs(got.left - x) > 1) {
          layer.style.left = (2 * x - got.left) + 'px';
          layer.style.top = (2 * y - got.top) + 'px';
        }
        void layer.offsetWidth;
        layer.style.animation = '';
        owner = p; p.classList.add('is-zoomed');
      };
      const add = (name) => {
        if (seen.has(name) || !(IMG.test(name) || VID.test(name))) return;
        seen.add(name);
        const fig = document.createElement('figure');
        fig.className = 'pin';
        fig.style.setProperty('--ar', rnd(0.55, 1.05).toFixed(3));
        fig.style.setProperty('--z', rnd(1, 1.6).toFixed(3));
        fig.style.setProperty('--ox', Math.round(rnd(30, 70)) + '%');
        fig.style.setProperty('--oy', Math.round(rnd(30, 70)) + '%');
        const src = DIR + encodeURIComponent(name);
        let m;
        if (VID.test(name)) {
          m = document.createElement('video');
          Object.assign(m, { src, muted: true, loop: true, autoplay: true, playsInline: true, preload: 'metadata' });
          m.setAttribute('muted', ''); m.setAttribute('playsinline', '');
        } else {
          m = document.createElement('img');
          Object.assign(m, { src, alt: '', loading: 'lazy', decoding: 'async' });
        }
        m.addEventListener('error', () => fig.remove());   // file not there (e.g. deleted) -> no empty tile
        fig.appendChild(m);
        if (hover) { fig.addEventListener('pointerenter', () => open(fig)); fig.addEventListener('pointerleave', close); }
        grid.appendChild(fig);
      };
      window.addEventListener('scroll', close, { passive: true });

      const fromGitHub = async () => {
        const KEY = 'gallery-list-v2';
        try {
          const c = JSON.parse(sessionStorage.getItem(KEY) || 'null');
          if (c && Date.now() - c.t < 10 * 60 * 1000) return c.list;
        } catch (e) {}
        const res = await fetch(API, { headers: { Accept: 'application/vnd.github+json' } });
        if (!res.ok) throw new Error(res.status);
        const list = (await res.json()).filter(f => f.type === 'file').map(f => f.name);
        try { sessionStorage.setItem(KEY, JSON.stringify({ t: Date.now(), list })); } catch (e) {}
        return list;
      };
      const local = location.protocol === 'file:' || /^(localhost|127\.)/.test(location.hostname);
      // on a local server (python -m http.server) the folder itself can be listed, so new files show up at once
      const fromLocalServer = async () => {
        const res = await fetch(DIR);
        if (!res.ok) throw new Error(res.status);
        const html = await res.text();
        return [...html.matchAll(/href="([^"?#\/]+)"/g)].map(m => decodeURIComponent(m[1]));
      };
      (location.protocol.startsWith('http') && local ? fromLocalServer().catch(fromGitHub) : fromGitHub())
        .then(list => shuffle(local ? list.concat(FALLBACK) : list).forEach(add))
        .catch(() => shuffle(FALLBACK.slice()).forEach(add));
    })();
  </script>
